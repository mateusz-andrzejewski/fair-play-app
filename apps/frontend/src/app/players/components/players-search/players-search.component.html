<section class="bg-gray-600 p-5">
  <form (ngSubmit)="onSearch()" class="grid grid-cols-1 lg:grid-cols-4">
    <div
      class="grid lg:col-span-3 grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 flex-1"
    >
      <mat-form-field>
        <mat-label>Imię</mat-label>
        <input [formControl]="form.controls.firstName" matInput />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Nazwisko</mat-label>
        <input [formControl]="form.controls.lastName" matInput />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Pozycja</mat-label>
        <mat-select [formControl]="form.controls.preferredPosition">
          @for (option of positionList; track option) {
            <mat-option [value]="option.value">{{
              option.viewValue
            }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div class="flex justify-center lg:justify-end gap-2 px-2">
      <button type="submit" class="max-w-60 flex-1" matButton="filled">
        Szukaj
      </button>
      <button
        (click)="clearFilters()"
        matMiniFab
        aria-label="Example icon button with a delete icon"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </form>
</section>

<section class="flex justify-between items-center my-2">
  <h3 class="text-lg p-5">Lista graczy</h3>
  <button matButton="outlined" (click)="openDialog()">Dodaj</button>
</section>

<div class="mat-elevation-z8">
  <table
    mat-table
    [dataSource]="dataSource"
    matSort
    matSortDisableClear
    (matSortChange)="onSortChange($event)"
  >
    <!-- First name Column -->
    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="firstName">
        Imię
      </th>
      <td mat-cell *matCellDef="let element">{{ element.firstName }}</td>
    </ng-container>

    <!-- Last name Column -->
    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="lastName">
        Nazwisko
      </th>
      <td mat-cell *matCellDef="let element">{{ element.lastName }}</td>
    </ng-container>

    <!-- Preferred position Column -->
    <ng-container matColumnDef="preferredPosition">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="preferredPosition">
        Pozycja
      </th>
      <td mat-cell *matCellDef="let element">
        {{ element.preferredPosition }}
      </td>
    </ng-container>

    <!-- Is approved Column -->
    <ng-container matColumnDef="nickname">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="nickname">
        Pasudonim
      </th>
      <td mat-cell *matCellDef="let element">{{ element.nickname }}</td>
    </ng-container>

    <ng-container matColumnDef="skillRate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="skillRate">
        SkillRate
      </th>
      <td mat-cell *matCellDef="let element">{{ element.skillRate }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [length]="totalItems"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
    (page)="onPageChange($event)"
  >
  </mat-paginator>
</div>
