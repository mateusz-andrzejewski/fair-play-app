<div [ngClass]="dialogData.size">
  <h2 mat-dialog-title class="text-lg">{{ dialogData.title }}</h2>
  <section mat-dialog-content>
    <form class="grid grid-cols-2 gap-2">
      <mat-form-field>
        <mat-label>Imię</mat-label>
        <input [formControl]="form.controls.firstName" matInput />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Nazwisko</mat-label>
        <input [formControl]="form.controls.lastName" matInput />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Pozycja</mat-label>
        <mat-select [formControl]="form.controls.preferredPosition">
          @for (option of positionList; track option) {
            <mat-option [value]="option.value">{{
              option.viewValue
            }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Stopień umiejętności</mat-label>
        <input [formControl]="form.controls.skillRate" matInput type="number" min="1" max="10" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Pseudonim</mat-label>
        <input [formControl]="form.controls.nickname" matInput />
      </mat-form-field>
    </form>
  </section>
  <mat-dialog-actions align="end">
    <button matButton (click)="onClose()">Anuluj</button>
    <button matButton  cdkFocusInitial (click)="onSave()">Zapisz</button>
  </mat-dialog-actions>
</div>
