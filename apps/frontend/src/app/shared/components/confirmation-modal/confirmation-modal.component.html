<div [ngClass]="dialogData.size">
  <h2 mat-dialog-title class="text-lg">{{ dialogData.title }}</h2>
  <section mat-dialog-content>
    <p>{{ dialogData.passedData.message }}</p>
  </section>
  <mat-dialog-actions align="end">
    <button matButton (click)="onClose()">Anuluj</button>
    <button matButton color="warn" cdkFocusInitial (click)="onConfirm()">Potwierdź</button>
  </mat-dialog-actions>
</div>
